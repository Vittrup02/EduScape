<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <pattern id="tiles" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect width="80" height="80" fill="#C6DEDD"/>
      <path d="M0 .5h80M.5 0v80" stroke="#AECBCA" stroke-width="3"/>
    </pattern>
    <linearGradient id="ceiling-light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow-green" r="0.5">
      <stop offset="0" stop-color="#9BF0CB" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#9BF0CB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-blue" r="0.5">
      <stop offset="0" stop-color="#A9CBFF" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#A9CBFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.4" r="0.8">
      <stop offset="0.55" stop-color="#10262B" stop-opacity="0"/>
      <stop offset="1" stop-color="#10262B" stop-opacity="0.45"/>
    </radialGradient>
  </defs>

