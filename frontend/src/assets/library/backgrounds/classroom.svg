<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C3D8D1"/>
      <stop offset="1" stop-color="#A9C3BB"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E4F2F6"/>
      <stop offset="1" stop-color="#A8D0E2"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D6B588"/>
      <stop offset="1" stop-color="#B8925F"/>
    </linearGradient>
    <linearGradient id="shaft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.45" cy="0.45" r="0.75">
      <stop offset="0.6" stop-color="#1E2B2A" stop-opacity="0"/>
      <stop offset="1" stop-color="#1E2B2A" stop-opacity="0.35"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#wall)"/>
  <rect y="600" width="1600" height="90" fill="#9BB6AE"/>
  <rect y="600" width="1600" height="6" fill="#B7CCC5"/>

  <!-- window -->
  <rect x="90" y="130" width="330" height="430" rx="6" fill="#EEF2EE"/>
  <rect x="110" y="150" width="290" height="390" fill="url(#sky)"/>
  <path d="M110 470c60-40 110-20 150-50s80-30 140-10v130H110z" fill="#9CC2B0"/>
  <path d="M110 500c70-30 140-10 200-30s70-10 90 0v70H110z" fill="#7FAE98"/>
  <path d="M255 150v390M110 345h290" stroke="#EEF2EE" stroke-width="14"/>
  <rect x="76" y="556" width="358" height="22" rx="4" fill="#E2E8E3"/>
  <path d="M370 556c-6-30 4-52 20-60-2 18-4 40-8 60z" fill="#5E9C72"/>
  <path d="M380 556c4-26 20-40 36-42-8 14-16 30-24 42z" fill="#4C8A61"/>
  <rect x="362" y="536" width="44" height="22" rx="4" fill="#C7704E"/>

  <!-- blackboard -->
  <rect x="560" y="150" width="720" height="380" rx="8" fill="#B88B58"/>
  <rect x="578" y="168" width="684" height="344" rx="4" fill="#2F4F43"/>
  <g fill="none" stroke="#E7EFE9" stroke-opacity="0.65" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M640 440l80-160 90 160z"/>
    <path d="M650 260h120M650 290h80"/>
    <path d="M880 420c40-180 100-180 140 0"/>
    <path d="M860 440h200M870 230v220"/>
    <circle cx="1160" cy="300" r="56"/>
    <path d="M1160 300l40-40M1110 420h110M1110 452h70"/>
  </g>
  <rect x="566" y="522" width="708" height="16" rx="4" fill="#9C7446"/>
  <rect x="640" y="514" width="34" height="9" rx="3" fill="#F4F1E8"/>
  <rect x="700" y="515" width="44" height="8" rx="3" fill="#F2D49B"/>

  <!-- clock -->
  <circle cx="1440" cy="210" r="62" fill="#F4F6F2" stroke="#4E6A62" stroke-width="10"/>
  <g stroke="#4E6A62" stroke-width="6" stroke-linecap="round">
    <path d="M1440 160v12M1440 248v12M1390 210h12M1478 210h12"/>
    <path d="M1440 210v-34M1440 210l24 16"/>
  </g>

  <!-- floor -->
  <rect y="690" width="1600" height="210" fill="url(#floor)"/>
  <rect y="690" width="1600" height="16" fill="#8FA9A1"/>
  <g stroke="#B58F5D" stroke-width="3" stroke-opacity="0.7">
    <path d="M0 760h1600M0 830h1600"/>
    <path d="M240 706v54M690 706v54M1180 706v54M80 760v70M500 760v70M960 760v70M1420 760v70M330 830v70M820 830v70M1290 830v70"/>
  </g>

  <!-- teacher's desk -->
  <rect x="1190" y="610" width="320" height="24" rx="4" fill="#C79A62"/>
  <rect x="1210" y="634" width="22" height="170" fill="#8E6A42"/>
  <rect x="1468" y="634" width="22" height="170" fill="#8E6A42"/>
  <rect x="1360" y="634" width="130" height="110" fill="#A97F4F"/>
  <rect x="1240" y="566" width="80" height="44" rx="3" fill="#D46A4E"/>
  <rect x="1250" y="556" width="76" height="12" rx="3" fill="#4E7FA6"/>

  <!-- light from the window -->
  <path d="M110 150h290l700 750H330z" fill="url(#shaft)"/>
  <rect width="1600" height="900" fill="url(#vignette)"/>
</svg>
