name: CI

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development, main]

# Cancel older pull request runs when new commits are pushed. Pushes to development/main queue up instead,
# so a running database migration is never cancelled halfway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        # Throw-away credentials for the CI-only database container
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eduscape
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Integration tests create their own databases on this server
      ConnectionStrings__Default: Host=localhost;Port=5432;Database=eduscape;Username=postgres;Password=postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Lint
        run: dotnet format --no-restore --verify-no-changes

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

  docker:
    name: Backend Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same Dockerfile and build context as Render, so a broken image fails here first
      - name: Build image
        run: docker build --tag eduscape-api:ci backend

      # Production must never store the Data Protection keys unencrypted
      - name: Refuses to start without the Data Protection certificate
        run: |
          if timeout 60 docker run --rm --env PORT=10000 eduscape-api:ci > no-certificate.log 2>&1; then
            echo "::error::The container started without DataProtection__CertificatePath"
            exit 1
          fi
          if ! grep --quiet "DataProtection__CertificatePath" no-certificate.log; then
            echo "::error::The container did not explain that the Data Protection certificate is missing"
            cat no-certificate.log
            exit 1
          fi

      # Throw-away certificate, mounted like a Render secret file: /etc/secrets, readable by group 1000 only
      - name: Create throw-away Data Protection certificate
        run: |
          mkdir "$RUNNER_TEMP/secrets"
          openssl req -x509 -newkey rsa:3072 -sha256 -days 1 -nodes -subj "/CN=eduscape-ci" \
            -keyout "$RUNNER_TEMP/key.pem" -out "$RUNNER_TEMP/certificate.pem"
          cat "$RUNNER_TEMP/certificate.pem" "$RUNNER_TEMP/key.pem" > "$RUNNER_TEMP/secrets/dataprotection.pem"
          sudo chown root:1000 "$RUNNER_TEMP/secrets/dataprotection.pem"
          sudo chmod 640 "$RUNNER_TEMP/secrets/dataprotection.pem"

      # Like Render: PORT is injected and the app must answer on 0.0.0.0:$PORT (no database needed for /health)
      - name: Smoke test /health
        run: |
          docker run --detach --name api --publish 10000:10000 --env PORT=10000 \
            --volume "$RUNNER_TEMP/secrets:/etc/secrets:ro" \
            --env DataProtection__CertificatePath=/etc/secrets/dataprotection.pem \
            eduscape-api:ci
          for i in $(seq 1 30); do
            if curl --silent --fail http://localhost:10000/health; then
              echo " - container is healthy"
              exit 0
            fi
            sleep 1
          done
          echo "Container did not answer on /health within 30 seconds"
          docker logs api
          exit 1

  frontend:
    name: Frontend (lint, unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test -- --run

      - name: Build
        run: npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:17
        # Throw-away credentials for the CI-only database container
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eduscape
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Also inherited by the backend that Playwright starts
      ConnectionStrings__Default: Host=localhost;Port=5432;Database=eduscape;Username=postgres;Password=postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore .NET tools
        working-directory: backend
        run: dotnet tool restore

      # `dotnet ef` builds the projects without restoring them, so a fresh checkout needs this first
      - name: Restore NuGet packages
        working-directory: backend
        run: dotnet restore

      # Development environment so the demo escape room is seeded
      - name: Migrate and seed database
        working-directory: backend
        env:
          ASPNETCORE_ENVIRONMENT: Development
        run: dotnet ef database update --project Eduscape.Infrastructure --startup-project Eduscape.Api

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps

      # playwright.config.ts starts the backend and frontend via `webServer`
      - name: Run Playwright tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  migrate:
    name: Migrate database (Neon)
    # Only for pushes to development/main (see `on:`), never for pull requests, and only when everything else is green
    if: github.event_name == 'push'
    needs: [backend, docker, frontend, e2e]
    runs-on: ubuntu-latest
    # development → Neon dev database, main → production. Each environment holds its own NEON_CONNECTION_STRING.
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    env:
      TARGET_ENVIRONMENT: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Restore NuGet packages
        run: dotnet restore

      - name: Build migration bundle
        run: dotnet ef migrations bundle --project Eduscape.Infrastructure --startup-project Eduscape.Api --configuration Release --output efbundle --force

      # The connection string only exists in this step's environment. It is passed to the bundle as an environment
      # variable (never via --connection, never echoed), and GitHub masks the secret in the log as well.
      - name: Apply migrations
        env:
          NEON_CONNECTION_STRING: ${{ secrets.NEON_CONNECTION_STRING }}
          # EF tools default to Development, which would seed the demo room into Neon
          ASPNETCORE_ENVIRONMENT: Production
        run: |
          if [ -z "$NEON_CONNECTION_STRING" ]; then
            echo "::error title=Missing secret::NEON_CONNECTION_STRING is not set in the GitHub environment '$TARGET_ENVIRONMENT'. See README, 'Migrationer'."
            exit 1
          fi
          export ConnectionStrings__Default="$NEON_CONNECTION_STRING"
          if ! ./efbundle; then
            echo "::error title=Database migration failed::Migrations against the '$TARGET_ENVIRONMENT' database failed. The log above shows which migrations were applied before the error."
            exit 1
          fi
          echo "Migrations applied to the '$TARGET_ENVIRONMENT' database." >> "$GITHUB_STEP_SUMMARY"
